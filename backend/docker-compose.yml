services:
  db:
    image: postgres:16-alpine
    container_name: carcinutri_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carcinutri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carcinutri"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: carcinutri_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/carcinutri
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
